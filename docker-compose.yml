version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: signalbot-postgres
    environment:
      POSTGRES_DB: signalbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signalbot-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: signalbot-backend
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/signalbot
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    container_name: signalbot-frontend
    environment:
      VITE_API_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
